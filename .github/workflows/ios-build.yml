name: Build & Upload iOS

on:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install iOS dependencies (FIXED)
        run: |
          cd ios
          pod repo remove trunk || true
          pod repo add trunk https://github.com/CocoaPods/Specs.git
          pod install
          
      - name: Reset CocoaPods
        run: |
          pod cache clean --all

      # ✅ BUILD IPA DIRECTLY (CORRECT WAY)
      - name: Build IPA
        run: |
          flutter clean
          flutter pub get
          flutter build ipa --release

      # 🔍 DEBUG
      - name: Show IPA files
        run: |
          echo "Checking IPA..."
          find build -name "*.ipa"

      # 🚀 UPLOAD TO APPLE (THIS WAS MISSING)
      - name: Upload to App Store
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

