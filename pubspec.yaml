name: car_wash_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # 🌍 Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  shared_preferences: ^2.2.2

  # 🔥 Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.0.0

  # 🗺️ FREE MAP (NO BILLING)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # 📍 Location & Geocoding
  geocoding: ^2.1.0
  location: ^5.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/l10n/
    - assets/images/
